name: Testes do CardLink

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Node.js e PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cardlink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cardlink_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      JWT_SECRET: cardlink-github-actions-test-secret
      CAKTO_SECRET: cardlink-cakto-github-actions-test-secret
      TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/cardlink_test

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Executar testes completos
        run: npm test
