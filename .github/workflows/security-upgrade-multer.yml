# trigger: 2026-08-28
name: Security upgrade Multer

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/security-upgrade-multer.yml'

permissions:
  contents: write

jobs:
  upgrade-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Upgrade Multer in root package
        run: npm install multer@^2.2.0 --save --package-lock-only

      - name: Upgrade Multer in backend package
        working-directory: backend
        run: npm install multer@^2.2.0 --save --package-lock-only

      - name: Harden upload limits
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/routes/upload.js')
          s = p.read_text(encoding='utf-8')
          old = "  limits: { fileSize: 5 * 1024 * 1024 }, // 5MB limit"
          new = "  limits: { fileSize: 5 * 1024 * 1024, files: 1, fields: 5, fieldNestingDepth: 1 }, // 5MB + limites anti-DoS"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Upload limits line not found')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate Multer version
        run: node -e "const v=require('multer/package.json').version; if(v!=='2.2.0') throw new Error('Expected multer 2.2.0, got '+v); console.log('multer',v)"

      - name: Commit security update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json backend/package.json backend/package-lock.json backend/routes/upload.js
          git diff --cached --quiet && exit 0
          git commit -m "security: atualizar Multer para 2.2.0 e endurecer uploads"
          git push origin master
