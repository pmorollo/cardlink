# trigger-v2
name: Final WhatsApp and UI cleanup

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/final-whatsapp-and-ui-cleanup.yml'

permissions:
  contents: write

jobs:
  clean-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Align WhatsApp and residual UI copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/app.js')
          s = p.read_text(encoding='utf-8')

          direct = 'https://wa.me/${cleanWhatsapp(whatsapp)}'
          tagged = "https://wa.me/${cleanWhatsapp(whatsapp)}?text=${encodeURIComponent('Olá! Vim pelo seu CardLink. ✅')}"
          count = s.count(direct)
          if count != 4:
              raise SystemExit(f'Esperava 4 links públicos diretos do WhatsApp; encontrei {count}')
          s = s.replace(direct, tagged)

          replacements = [
            ("document.title = 'CardLink — Seu negócio na internet em poucos minutos';",
             "document.title = 'CardLink — Tudo o que seu cliente precisa ver antes de chamar você';"),
            ('Ativação do <span class="text-gradient">CardLink PRO</span>',
             'Assinatura <span class="text-gradient">CardLink</span>'),
            ('O CardLink funciona exclusivamente com o plano PRO. Ative sua assinatura por apenas <strong>R$ 12,90/mês</strong> para acessar o painel de criação e publicar seu site profissional.',
             'Para acessar o painel de criação e publicar seu site profissional, é necessário manter uma assinatura CardLink ativa.'),
            ('🚀 O que está incluído no seu CardLink PRO:',
             '🚀 O que está incluído no CardLink:'),
            ('            <li>Geração de conteúdo com Inteligência Artificial</li>\n', ''),
            ('💳 Assinar CardLink PRO por R$ 12,90/mês',
             '💳 Assinar CardLink'),
            ("showToast('🎉', 'Assinatura PRO confirmada! Redirecionando...');",
             "showToast('🎉', 'Assinatura CardLink confirmada! Redirecionando...');"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Texto esperado não encontrado: {old[:100]}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate final public copy
        run: |
          test "$(grep -o "Olá! Vim pelo seu CardLink. ✅" frontend/app.js | wc -l)" -eq 4
          grep -q "Tudo o que seu cliente precisa ver antes de chamar você" frontend/app.js
          ! grep -q "CardLink PRO" frontend/app.js
          ! grep -q "Assinatura PRO confirmada" frontend/app.js

      - name: Install and test
        run: |
          npm ci
          npm test
          npm audit --omit=dev --audit-level=high

      - name: Commit final cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: alinhar WhatsApp e remover resíduos PRO da interface"
          git push origin master
