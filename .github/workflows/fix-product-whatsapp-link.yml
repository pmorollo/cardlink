name: Fix product WhatsApp link

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-product-whatsapp-link.yml'

permissions:
  contents: write

jobs:
  fix-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Fix product-specific WhatsApp message
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/app.js')
          s = p.read_text(encoding='utf-8')
          old = "const waUrl = whatsapp ? `https://wa.me/${cleanWhatsapp(whatsapp)}?text=${encodeURIComponent('Olá! Vim pelo seu CardLink. ✅')}?text=${waMsg}` : '#';"
          new = "const waUrl = whatsapp ? `https://wa.me/${cleanWhatsapp(whatsapp)}?text=${waMsg}` : '#';"
          if old not in s:
              raise SystemExit('Link duplicado de produto não encontrado')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate WhatsApp links
        run: |
          test "$(grep -o "Olá! Vim pelo seu CardLink. ✅" frontend/app.js | wc -l)" -eq 3
          grep -Fq 'const waUrl = whatsapp ? `https://wa.me/${cleanWhatsapp(whatsapp)}?text=${waMsg}`' frontend/app.js
          ! grep -Fq "✅')}?text=" frontend/app.js
      - name: Install and test
        run: |
          npm ci
          npm test
          npm audit --omit=dev --audit-level=high
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: preservar mensagem específica no WhatsApp de produtos"
          git push origin master
